<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Principal</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="grids.css">
</head>

<body>

    <div class="popup-senha">
        <div class="container">
            <div class="row">
                <div class="col-12 centertext">
                    <input type="password" placeholder="Digite a senha: ..." class="input-senha">
                </div>
            </div>

            <div class="row">
                <div class="col-12 centertext">
                    <h4 class="display-senha-incorreta" >ERRO: Senha inválida, tente novamente</h4>
                </div>
            </div>

            <div class="row">
                <div class="col-12 centertext" style="gap: 10px;">
                    <button class="botao-enviar-senha" >Enviar</button>
                    <button class="botao-sou-visitante"  >Sou Visitante</button>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-12 centertext topo-text">
                <h1>MENU DE CONTROLE</h1>
            </div>
        </div>


    </div>

    <div class="container centertext" style="margin-top: 25px; gap: 65px;">
        <div class="progress-container">
            <div class="progress-circle-umidade">
                <h1><span class="progress-value-umidade">50%</span></h1>
                <h2><span class="descritive-value">UMIDADE</span></h2>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-circle-regador">
                <h1><span class="progress-value-regador">LIGADO</span></h1>
                <h2><span class="descritive-value">REGADOR</span></h2>
            </div>
        </div>


        <div class="progress-container">
            <div class="progress-circle-estufa">
                <h1><span class="progress-value-estufa">ABERTO</span></h1>
                <h2><span class="descritive-value">ESTUFA</span></h2>
            </div>
        </div>

    </div>



    <div class="container" style="margin-top: 40px;">
        <div class="row">


            <div id="para-centro" class="col-4">
                <div class="progress-container">
                    <div class="progress-circle-temperatura">
                        <h1><span class="progress-value-temperatura">25°C</span></h1>
                        <h2><span class="descritive-value">TEMPERATURA</span></h2>
                    </div>
                </div>
            </div>


            <div class="col-4 centertext">
                <button class="botao-regador">DESATIVAR REGADOR</button>
            </div>

            <div class="col-4 centertext">
                <button class="botao-estufa">FECHAR ESTUFA</button>
            </div>




        </div>
    </div>

    <script src="handler.js"></script>
    <script src="script.js"></script>



</body>

</html>
